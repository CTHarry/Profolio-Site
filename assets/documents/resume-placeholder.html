<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Placeholder</title>
    <style>
      :root {
        color: #122022;
        background: #f7f9f8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        max-width: 680px;
        border: 1px solid rgba(18, 32, 34, 0.12);
        border-radius: 18px;
        padding: 2rem;
        background: #ffffff;
        box-shadow: 0 16px 45px rgba(18, 32, 34, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Resume Placeholder</h1>
      <p>Replace this file with your resume PDF and update contact.html if the filename changes.</p>
    </main>
  </body>
</html>
